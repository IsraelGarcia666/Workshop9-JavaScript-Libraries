<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The code cat's scrambled weather forecast</title>
    <style>
      /* Center the content horizontally and vertically. */
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        margin: 0;
        padding: 1.25rem;
        color: #f3f7ff;
        background: #0c1429;
        font-family: system-ui, sans-serif;
      }

      /* Keep the content readable on narrow screens and limit its width to 42rem. */
      main {
        width: min(100%, 42rem);
        box-sizing: border-box;
        padding: clamp(1.5rem, 6vw, 3.25rem);
        border: 1px solid #52698c;
        border-top: 4px solid #b5f977;
        border-radius: 1rem;
        background: #172443;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
      }

      /* Reserve space for the forecast, including when short messages are shown. */
      .forecast {
        min-height: 3em;
        margin: 1.5rem 0;
        padding: 1rem;
        border-radius: 0.5rem;
        background: #0c1429;
        color: #c7ffa0;
        font:
          1.15rem / 1.5 ui-monospace,
          monospace;
      }

      button {
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        color: #0c1429;
        background: #b5f977;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #d3ffac;
      }

      /* Make keyboard focus clearly visible. */
      button:focus-visible {
        outline: 2px solid #f3f7ff;
        outline-offset: 4px;
      }

      /* Keep the text available to screen readers while hiding it visually. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      /* Animated cloud background using Vanta.js */
      #vanta-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      /* Keep the cat forecast above the clouds */
      main {
        position: relative;
        z-index: 1;
      }

      /* A moonlit scene to complement the Vanta.js clouds.
   I used CSS animations instead of another 3D library
   to keep the page lightweight. */

      .moon-scene {
        position: relative;
        height: 170px;
        margin: 20px 0;
        overflow: hidden;
      }

      /* Glowing crescent moon */
      .moon {
        position: absolute;
        top: 25px;
        left: 50%;
        width: 85px;
        height: 85px;
        border-radius: 50%;
        background: #fff0b3;
        box-shadow: 0 0 30px 8px rgba(255, 232, 155, 0.3);
        transform: translateX(-50%);
      }

      /* Dark circle creates the crescent shape */
      .moon::after {
        content: "";
        position: absolute;
        top: -14px;
        left: 25px;
        width: 85px;
        height: 85px;
        border-radius: 50%;
        background: #172443;
      }

      /* Soft clouds */
      .moon-cloud {
        position: absolute;
        width: 115px;
        height: 34px;
        background: linear-gradient(#c9d9f0, #6c86ad);
        border-radius: 50px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
      }

      .moon-cloud::before,
      .moon-cloud::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #aebfda;
      }

      .moon-cloud::before {
        width: 55px;
        height: 55px;
        left: 18px;
        bottom: 10px;
      }

      .moon-cloud::after {
        width: 65px;
        height: 65px;
        right: 12px;
        bottom: 3px;
      }

      /* Two clouds moving independently */
      .cloud-one {
        top: 100px;
        left: 12%;
        animation: cloud-drift 7s ease-in-out infinite alternate;
      }

      .cloud-two {
        top: 65px;
        right: 10%;
        opacity: 0.75;
        transform: scale(0.75);
        animation: cloud-drift-small 10s ease-in-out infinite alternate;
      }

      @keyframes cloud-drift {
        from {
          transform: translateX(-15px);
        }
        to {
          transform: translateX(25px);
        }
      }

      @keyframes cloud-drift-small {
        from {
          transform: translateX(15px) scale(0.75);
        }
        to {
          transform: translateX(-20px) scale(0.75);
        }
      }

      /* Respect reduced-motion accessibility preferences */
      @media (prefers-reduced-motion: reduce) {
        .moon-cloud {
          animation: none;
        }
      }

      /* Navigation back to the main workshop page */
      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #c7ffa0;
        font-weight: 600;
        text-decoration: none;
      }

      .back-link:hover,
      .back-link:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="vanta-bg" aria-hidden="true"></div>
    <main>
      <!-- Floating moon and clouds inside the forecast card -->
      <div class="moon-scene" aria-hidden="true">
        <div class="moon"></div>
        <div class="moon-cloud cloud-one"></div>
        <div class="moon-cloud cloud-two"></div>
      </div>

      <h1>
        <span aria-hidden="true">🐱</span> The code cat's scrambled weather
        forecast
      </h1>

      <!-- Hide the animation's random characters from screen readers.
         Screen readers receive the finished forecast through a separate status message. -->
      <p id="ennuste" class="forecast" aria-hidden="true">
        [ FORECAST ENCRYPTED ]
      </p>
      <p id="tulos" class="sr-only" role="status"></p>

      <button id="paljasta" type="button">Decode the cat code</button>
      <a class="back-link" href="index.html"> ← Back to Workshop 9 </a>
    </main>

    <!-- Three.js powers the 3D animation used by Vanta.js. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <!-- Load the Vanta.js Clouds effect. -->
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.clouds.min.js"></script>

    <script>
      // Animated clouds behind the cat's weather forecast.
      VANTA.CLOUDS({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        skyColor: 0x19365c,
        cloudColor: 0x849cb7,
        cloudShadowColor: 0x102039,
        sunColor: 0xffb45e,
        sunGlareColor: 0xffaa55,
        sunlightColor: 0xffcc88,
        speed: 0.7,
      });
    </script>

    <!-- Load Baffle.js before the page's JavaScript. -->
    <script src="https://cdn.jsdelivr.net/npm/baffle@0.3.6/dist/baffle.min.js"></script>
    <script>
      // Forecasts are shown in order. Add your own forecast to this list.
      const ennusteet = [
        "Scattered showers by day. Meows by night.",
        "It's raining tuna. Bring a fork when you go out.",
        "Wind speed: three cats per second.",
        "It's raining cats and dogs. Bring a bone-brella.",
        "The sun is shining, but the cats are casting shadows.",
        "Temperature: 25°C. The cats think it's too hot.",
        "The forecast is cloudy with a chance of catnip.",
        "The cats are predicting a purr-fect day.",
        "The cats are forecasting a meow-nificent day.",
        "The cats are forecasting a paws-itively sunny day.",
        "The cats are forecasting a fur-tastic day.",
      ];

      const ennuste = document.getElementById("ennuste");
      const tulos = document.getElementById("tulos");

      // Create the animation if Baffle.js loaded; otherwise show the forecast directly.
      const animaatio =
        typeof baffle === "function" ? baffle("#ennuste") : null;

      // Check whether the user prefers reduced motion when the button is clicked.
      const vahennettyLiike = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );

      // Remember the previous forecast to avoid repeating it.
      let previousIndex = -1;

      document.getElementById("paljasta").addEventListener("click", () => {
        // Select a random forecast without repeating the previous one.
        let randomIndex;

        do {
          randomIndex = Math.floor(Math.random() * ennusteet.length);
        } while (randomIndex === previousIndex && ennusteet.length > 1);

        previousIndex = randomIndex;
        const viesti = ennusteet[randomIndex];

        // Provide the finished forecast to screen readers.
        tulos.textContent = viesti;

        if (animaatio && !vahennettyLiike.matches) {
          // Set the new text, scramble it, then reveal it over 900 ms.
          animaatio
            .text(() => viesti)
            .start()
            .reveal(900);
        } else {
          // Stop any running animation and show the forecast immediately.
          animaatio?.reveal();
          ennuste.textContent = viesti;
        }
      });
    </script>
  </body>
</html>
